<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1626">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Skyline Mobile Builder</title>
<style>
:root{--u:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1626;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}
#stage{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(circle at 50% 30%,#1b3556,#07101d)}
#app{position:relative;height:100%;width:min(100vw,calc(100vh*.62));width:min(100vw,calc(100dvh*.62));font-size:calc(var(--u)*14px);overflow:hidden;background:#9fd6f5;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.glass{background:rgba(16,26,46,.68);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:.9em;box-shadow:0 3px 10px rgba(0,0,0,.25)}

/* HUD superior */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 0;pointer-events:none;display:flex;flex-direction:column;gap:5px}
.chips{display:flex;gap:4px}
.chip{flex:1;min-width:0;padding:.32em .1em .26em;text-align:center;position:relative;line-height:1.15}
.chip i{font-style:normal;font-size:1.05em;display:block}
.chip b{font-size:.9em;display:block;white-space:nowrap}
.chip small{font-size:.55em;opacity:.7;display:block}
.chip.bad b{color:#ff6b6b}
.row2{display:flex;gap:5px;align-items:stretch}
.daybox{flex:1;min-width:0;padding:.35em .6em;font-size:.82em;display:flex;flex-direction:column;justify-content:center;gap:.3em}
.daybox span{font-weight:800;margin-left:.3em}
.daybox .up{color:#6dff8d}.daybox .dn{color:#ff7b7b}
.dbar{height:.3em;background:rgba(255,255,255,.18);border-radius:1em;overflow:hidden}
#dayBar{height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff9f1c)}
.rci{display:flex;gap:.55em;padding:.3em .7em .25em;align-items:flex-end}
.rci .col{display:flex;flex-direction:column;align-items:center;gap:.15em}
.rci .trk{position:relative;width:.85em;height:2.1em;background:rgba(255,255,255,.14);border-radius:.3em;overflow:hidden}
.rci .trk:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.55)}
.rci .fill{position:absolute;left:0;right:0}
.rci .r{background:#4cd964}.rci .cc{background:#3b9cff}.rci .ii{background:#ffcc00}
.rci span{font-size:.6em;font-weight:800;opacity:.85}
.ctrls{display:flex;gap:4px}
.rb{pointer-events:auto;width:2.5em;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0}
.rb.off{opacity:.5}
.rb:active{transform:scale(.93)}
.fl{position:absolute;left:50%;top:100%;font-weight:800;font-size:.95em;animation:fl 1.3s ease-out forwards;pointer-events:none;text-shadow:0 1px 3px #000;white-space:nowrap}
.fl.up{color:#6dff8d}.fl.dn{color:#ff7b7b}
@keyframes fl{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,30px)}}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translate(-50%,-8px);background:rgba(10,16,30,.9);padding:.5em 1em;border-radius:2em;font-size:.82em;font-weight:700;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(255,255,255,.18)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Panel inferior */
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 6px calc(env(safe-area-inset-bottom,0px) + 6px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
#bottom>*{pointer-events:auto}
#infobar{display:flex;align-items:center;gap:.55em;padding:.5em .6em}
.hidden{display:none!important}
.ib-ico{font-size:1.8em;width:1.25em;text-align:center;flex:none}
.ib-txt{flex:1;min-width:0;line-height:1.25}
.ib-txt b{display:block;font-size:.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib-txt span{display:block;font-size:.7em;opacity:.82}
.ib-txt em{display:block;font-size:.7em;font-style:normal;color:#ffc861;font-weight:600}
.ib-btns{display:flex;gap:.35em;align-items:center;flex:none}
.btn{border-radius:.8em;padding:.62em .8em;font-weight:800;font-size:.78em;background:#4cd964;color:#06240f;box-shadow:0 2px 0 rgba(0,0,0,.28);white-space:nowrap}
.btn.sec{background:#ffb347;color:#3a2200}
.btn.red{background:#ff5a5f;color:#fff}
.btn.x{background:rgba(255,255,255,.16);color:#fff;padding:.62em .7em;box-shadow:none}
.btn:disabled{opacity:.45;filter:grayscale(.6)}
.btn:active{transform:translateY(1px)}
#subbar{display:flex;gap:5px;padding:.4em}
.sb{flex:1;min-width:0;border-radius:.75em;background:rgba(255,255,255,.09);padding:.45em .2em;display:flex;flex-direction:column;align-items:center;gap:.1em;line-height:1.15;border:2px solid transparent}
.sb i{font-style:normal;font-size:1.4em}
.sb b{font-size:.68em}
.sb small{font-size:.58em;opacity:.8}
.sb.on{background:rgba(179,107,255,.35);border-color:#b36bff}
.sb.poor{opacity:.55}
#toolbar{display:flex;gap:4px;padding:.4em .35em .35em}
.tb{--c:#4cd964;flex:1;min-width:0;border-radius:.8em;padding:.38em 0 .3em;background:rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:.05em;transition:transform .12s,background .12s}
.tb .ic{font-size:1.6em;line-height:1.15}
.tb .lb{font-size:.62em;font-weight:800;white-space:nowrap}
.tb .co{font-size:.56em;opacity:.78;white-space:nowrap}
.tb.on{background:var(--c);transform:translateY(-5px);box-shadow:0 5px 14px rgba(0,0,0,.4);color:#08121f}
.tb.poor{opacity:.55}
.tb:active{transform:scale(.94)}
.tb.on:active{transform:translateY(-5px) scale(.96)}

/* Modal */
#modal{position:absolute;inset:0;background:rgba(5,10,20,.7);display:none;align-items:center;justify-content:center;padding:1.2em;z-index:20}
#modal.show{display:flex}
#mBox{width:100%;max-height:90%;overflow:auto;padding:1.1em;background:#14233d;border:1px solid rgba(255,255,255,.18);border-radius:1.2em;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#mBox h2{margin:.1em 0 .6em;font-size:1.15em}
#mBox ul{margin:.2em 0 1em;padding-left:1.1em;font-size:.82em;line-height:1.5;opacity:.92}
.mb{display:block;width:100%;margin:.4em 0;padding:.8em;border-radius:.8em;background:rgba(255,255,255,.1);font-size:.85em;font-weight:700;text-align:left}
.mb.warn{background:rgba(255,90,95,.25)}
.mb:active{transform:scale(.98)}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#0b1626;color:#fff;z-index:50;font-size:16px;line-height:1.6;padding:20px}

/* v2 */
#subbar{flex-direction:column;gap:4px}
.srow{display:flex;gap:4px}
.sb{padding:.35em .1em}
.sb i{font-size:1.2em}
#vAlert{font-style:normal;margin-left:.45em;font-weight:800;animation:pls 1s infinite}
@keyframes pls{50%{opacity:.45}}
</style>
</head>
<body>
<div id="boot">🏙️ Cargando ciudad…</div>
<div id="stage">
<div id="app">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="chips">
      <div class="chip glass"><i>👥</i><b id="vPop">0</b><small>Población</small></div>
      <div class="chip glass"><i id="iHap">🙂</i><b id="vHap">60%</b><small>Felicidad</small></div>
      <div class="chip glass" id="chMoney"><i>💰</i><b id="vMoney">0</b><small>Dinero</small></div>
      <div class="chip glass" id="chPow"><i>⚡</i><b id="vPow">0/0</b><small>Energía</small></div>
      <div class="chip glass" id="chWat"><i>💧</i><b id="vWat">0/0</b><small>Agua</small></div>
    </div>
    <div class="row2">
      <div class="glass daybox">
        <div>Día <b id="vDay">1</b><span id="vNet"></span><em id="vAlert"></em></div>
        <div class="dbar"><div id="dayBar"></div></div>
      </div>
      <div class="glass rci">
        <div class="col"><div class="trk"><div id="dR" class="fill r"></div></div><span>R</span></div>
        <div class="col"><div class="trk"><div id="dC" class="fill cc"></div></div><span>C</span></div>
        <div class="col"><div class="trk"><div id="dI" class="fill ii"></div></div><span>I</span></div>
      </div>
      <div class="ctrls">
        <button class="rb glass" id="bSpeed" aria-label="Velocidad">1×</button>
        <button class="rb glass" id="bCover" aria-label="Cobertura">⭕</button>
        <button class="rb glass" id="bMenu" aria-label="Menú">☰</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="bottom">
    <div id="infobar" class="glass hidden">
      <div class="ib-ico" id="ibIco"></div>
      <div class="ib-txt"><b id="ibTitle"></b><span id="ibSub"></span><em id="ibWarn"></em></div>
      <div class="ib-btns">
        <button class="btn" id="ibA"></button>
        <button class="btn sec" id="ibB"></button>
        <button class="btn x" id="ibX" aria-label="Cerrar">✕</button>
      </div>
    </div>
    <div id="subbar" class="glass hidden"><div id="sub1" class="srow"></div><div id="sub2" class="srow hidden"></div></div>
    <div id="toolbar" class="glass"></div>
  </div>

  <div id="modal"><div id="mBox"><div id="mBody"></div></div></div>
</div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
var boot=document.getElementById('boot');
if(typeof THREE==='undefined'||!THREE.OrbitControls){
  boot.innerHTML='⚠️ No se pudo cargar Three.js.<br>Comprueba tu conexión y recarga la página.';
  return;
}

/* ====================== HELPERS Y CONFIG ====================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const N=16, HALF=N/2, DAY_LEN=5;
const SAVE_KEY='skyline-mobile-builder-v2';
const cx=i=>i-HALF+.5, cz=j=>j-HALF+.5;
const inb=(i,j)=>i>=0&&j>=0&&i<N&&j<N;
const pick=(arr,i)=>arr[((i%arr.length)+arr.length)%arr.length];
const fmt=n=>(n<0?'-':'')+Math.floor(Math.abs(n)).toLocaleString('es-ES');

/* --- Economía (rebalanceada) --- */
const START_MONEY=1500, REFUND=.2;
const R={power:6,water:6,park:3.5};
const CAP={power:80,water:80};
const SZ_LBL=['Pequeño 1×1','Mediano 2×2','Grande 3×3'];
/* Servicios por tamaño: coste, mantenimiento/día, radio, capacidad (niveles de edificio atendidos) */
const SV={
  police:{names:['Puesto de policía','Comisaría','Jefatura de policía'],cost:[350,900,2000],up:[6,16,36],r:[3.5,5,7],cap:[10,30,70]},
  fire:{names:['Retén de bomberos','Parque de bomberos','Cuartel central'],cost:[400,1000,2200],up:[7,18,40],r:[3.5,5,7],cap:[10,30,70]},
  waste:{names:['Punto de recogida','Vertedero','Gran vertedero'],cost:[300,800,1800],up:[5,14,30],r:[4,6,8],cap:[14,45,110]}
};
const TOOLS={
  res:{name:'Zona Residencial',icon:'🏠',cost:120,zone:true,upkeep:0,tint:'#bfe8ab',desc:'Viviendas (3 niveles). Necesita carretera, ⚡ y 💧.'},
  com:{name:'Zona Comercial',icon:'🏪',cost:200,zone:true,upkeep:0,tint:'#a9d4f5',desc:'Comercios: empleo e ingresos. Necesita clientes.'},
  ind:{name:'Zona Industrial',icon:'🏭',cost:260,zone:true,upkeep:0,tint:'#f2da8f',desc:'Fábricas: mucho empleo, pero hacen ruido.'},
  road:{name:'Carretera',icon:'🛣️',desc:'Todo edificio necesita una carretera adyacente.'},
  park:{name:'Parque',icon:'🌳',cost:90,upkeep:3,desc:'Sube la felicidad en radio 3.5. Necesita carretera.'},
  power:{name:'Planta Eléctrica',icon:'⚡',cost:500,upkeep:9,desc:'Produce 80 de energía · radio 6.'},
  water:{name:'Torre de Agua',icon:'💧',cost:350,upkeep:7,desc:'Produce 80 de agua · radio 6.'},
  police:{name:'Policía',icon:'🚓'},
  fire:{name:'Bomberos',icon:'🚒'},
  waste:{name:'Residuos',icon:'🗑️'}
};
const ROADS={
  basic:{name:'Carretera básica',cost:15,upkeep:.4,cap:25,icon:'🛣️'},
  avenue:{name:'Avenida principal',cost:60,upkeep:1.5,cap:70,icon:'🛤️'}
};
const ROAD_UPG=55;
const KINDS=['power','water','police','fire','waste'];
const SHORT={power:'Energía',water:'Agua',police:'Policía',fire:'Bomberos',waste:'Residuos'};
const LEVEL_NAMES={
  res:['Casas','Edificio de pisos','Torre residencial'],
  com:['Tienda','Centro comercial','Rascacielos'],
  ind:['Almacén','Fábrica','Complejo industrial']
};
const POPCAP=[8,22,48];
const JOBS={com:[5,14,30],ind:[8,20,42]};
const INC={com:[14,36,76],ind:[16,40,84]};
const CONS_P={res:[2,5,11],com:[3,7,15],ind:[6,14,28]};
const CONS_W={res:[1,3,7],com:[1,3,6],ind:[3,7,14]};
const UPG={res:[180,420],com:[260,560],ind:[340,740]};
const GROW=[14,26];                 /* días de demanda estable para subir de nivel */
const TRIPS={res:[3,8,18],com:[5,14,30],ind:[4,10,22]};
const TRASH_GEN=[2.5,4,6.5];        /* basura/día sin recogida */
const HGT={res:[.75,1.0,2.25],com:[.5,1.0,2.9],ind:[.75,1.0,1.5]};
const MILESTONES=[50,100,250,500,1000,2500,5000];
const SPEEDS=[1,2,3,0], SPEED_LBL=['1×','2×','3×','⏸'];

const isSv=k=>!!SV[k];
function costOf(k,opt){
  if(k==='road')return ROADS[opt||'basic'].cost;
  if(SV[k])return SV[k].cost[(opt||1)-1];
  return TOOLS[k].cost;
}
function upkeepOf(b){
  if(b.key==='road')return ROADS[b.tier].upkeep;
  if(SV[b.key])return SV[b.key].up[b.s-1];
  return TOOLS[b.key].upkeep||0;
}
function radiusOf(b){
  if(b.key==='power')return R.power;
  if(b.key==='water')return R.water;
  if(b.key==='park')return R.park;
  if(SV[b.key])return SV[b.key].r[b.s-1];
  return 0;
}
function nameOf(b){
  if(b.key==='road')return ROADS[b.tier].name;
  if(SV[b.key])return SV[b.key].names[b.s-1];
  if(TOOLS[b.key].zone)return LEVEL_NAMES[b.key][b.level-1];
  return TOOLS[b.key].name;
}
function iconOf(b){return b.key==='road'?ROADS[b.tier].icon:TOOLS[b.key].icon;}
function topY(b){
  if(HGT[b.key])return HGT[b.key][b.level-1];
  if(SV[b.key])return .6+.2*b.s;
  if(b.key==='water')return 1.15;
  if(b.key==='power')return 1.0;
  return .6;
}

let CFG={sound:true,quick:false,help:false};
try{Object.assign(CFG,JSON.parse(localStorage.getItem(SAVE_KEY+'-cfg')||'{}'));}catch(e){}
function saveCfg(){try{localStorage.setItem(SAVE_KEY+'-cfg',JSON.stringify(CFG));}catch(e){}}

const S={money:START_MONEY,day:1,pop:0,popTarget:0,happy:60,powerProd:0,powerCons:0,waterProd:0,waterCons:0,
  income:0,upkeep:0,net:0,dR:.5,dC:.3,dI:.3,pr:1,wr:1,speedIdx:0,ms:0,fires:0,thefts:0};
const grid=[];for(let i=0;i<N;i++)grid.push(new Array(N).fill(null));
let ALL=[];

/* ====================== AUDIO (Web Audio sintetizado) ====================== */
let AC=null;
function ensureAudio(){
  try{
    if(!AC){var Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx)AC=new Ctx();}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){}
}
function tone(f,d,type,v,slide,delay){
  if(!AC||!CFG.sound)return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);
}
function noise(d,v){
  if(!AC||!CFG.sound)return;
  const n=(AC.sampleRate*d)|0,b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  const g=AC.createGain();g.gain.value=v;
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start();
}
const SFX={
  click(){tone(720,.06,'triangle',.05);},
  build(){tone(330,.09,'square',.04);tone(494,.09,'square',.04,null,.08);tone(660,.16,'square',.04,null,.16);},
  demolish(){noise(.3,.18);tone(160,.28,'sawtooth',.05,60);},
  error(){tone(150,.18,'square',.05,110);},
  coin(){tone(1200,.08,'sine',.04);tone(1600,.14,'sine',.04,null,.07);},
  levelup(){tone(523,.1,'triangle',.06);tone(659,.1,'triangle',.06,null,.09);tone(784,.2,'triangle',.06,null,.18);},
  fanfare(){[523,659,784,1047].forEach((f,k)=>tone(f,.16,'triangle',.06,null,k*.11));}
};

/* ====================== ESCENA ====================== */
const app=$('app'),canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
const SKY='#9fd6f5';
const scene=new THREE.Scene();
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,100,200);
const camera=new THREE.PerspectiveCamera(40,9/16,1,260);

const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.12;
controls.screenSpacePanning=false;
controls.panSpeed=.9;controls.rotateSpeed=.45;controls.zoomSpeed=.8;
controls.minDistance=14;controls.maxDistance=78;
controls.minPolarAngle=.55;controls.maxPolarAngle=1.15;
controls.minAzimuthAngle=.185;controls.maxAzimuthAngle=1.385;
controls.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_ROTATE};
controls.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.ROTATE};
(function(){
  const r=52,phi=.95,th=.785;
  camera.position.set(r*Math.sin(phi)*Math.sin(th),r*Math.cos(phi),r*Math.sin(phi)*Math.cos(th));
  controls.target.set(0,0,0);controls.update();
})();
controls.addEventListener('change',function(){
  const t=controls.target;
  const nx=clamp(t.x,-HALF,HALF),nz=clamp(t.z,-HALF,HALF);
  if(nx!==t.x||nz!==t.z){
    camera.position.x+=nx-t.x;camera.position.z+=nz-t.z;
    t.x=nx;t.z=nz;
  }
});

scene.add(new THREE.HemisphereLight(0xe3f2ff,0x7a9a62,.78));
const sun=new THREE.DirectionalLight(0xfff1d6,.85);
sun.position.set(11,20,8);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-14;sun.shadow.camera.right=14;
sun.shadow.camera.top=14;sun.shadow.camera.bottom=-14;
sun.shadow.camera.near=1;sun.shadow.camera.far=60;
sun.shadow.bias=-.0006;
scene.add(sun);

/* ====================== GEOMETRÍA: plantillas + fusión ====================== */
const TPL={
  b:new THREE.BoxGeometry(1,1,1).translate(0,.5,0),
  c:new THREE.CylinderGeometry(1,1,1,12).translate(0,.5,0),
  k:new THREE.CylinderGeometry(0,1,1,12).translate(0,.5,0),
  p:new THREE.CylinderGeometry(0,1,1,4).rotateY(Math.PI/4).translate(0,.5,0)
};
const bx=(a,w,h,d,x,y,z,col)=>a.push({k:'b',w:w,h:h,d:d,x:x,y:y,z:z,col:col});

function geoFor(b){
  const k=b.key+'_'+(b.level||1)+'_'+(b.variant|0)+'_'+(b.s||1);
  if(GEO[k])return GEO[k];
  let g;
  switch(b.key){

    case'com':g=buildCom(b.level||1,b.variant|0);break;
    case'ind':g=buildInd(b.level||1,b.variant|0);break;

/* ====================== EDIFICIOS Y CARRETERAS ====================== */
const bsList=function(){
  const out=[];
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const b=grid[i][j];if(b&&b.i===i&&b.j===j)out.push(b);}
  return out;
};
const isRoad=(i,j)=>inb(i,j)&&!!grid[i][j]&&grid[i][j].key==='road';
const roadMaskAt=(i,j)=>(isRoad(i,j-1)?1:0)|(isRoad(i+1,j)?2:0)|(isRoad(i,j+1)?4:0)|(isRoad(i-1,j)?8:0);
function adjRoads(b){
  const out=[],seen=new Set();
  for(let a=b.i;a<b.i+b.s;a++)for(let c=b.j;c<b.j+b.s;c++){
    [[a+1,c],[a-1,c],[a,c+1],[a,c-1]].forEach(function(p){
      if(p[0]>=b.i&&p[0]<b.i+b.s&&p[1]>=b.j&&p[1]<b.j+b.s)return;
      if(isRoad(p[0],p[1])){const r=grid[p[0]][p[1]];if(!seen.has(r)){seen.add(r);out.push(r);}}
    });
  }
  return out;
}
function roadNbrs(r){
  const out=[];
  [[r.i+1,r.j],[r.i-1,r.j],[r.i,r.j+1],[r.i,r.j-1]].forEach(function(p){if(isRoad(p[0],p[1]))out.push(grid[p[0]][p[1]]);});
  return out;
}
function updateRoadsAround(i,j){
  [[i,j],[i+1,j],[i-1,j],[i,j+1],[i,j-1]].forEach(function(p){
    if(isRoad(p[0],p[1])){const r=grid[p[0]][p[1]];r.mesh.geometry=roadGeo(roadMaskAt(p[0],p[1]),r.tier);}
  });
}
function buildMesh(b,pop){
  if(b.mesh)scene.remove(b.mesh);
  const geo=b.key==='road'?roadGeo(roadMaskAt(b.i,b.j),b.tier):geoFor(b);
  const m=new THREE.Mesh(geo,bldMat);
  m.position.set(b.px-HALF,0,b.pz-HALF);
  m.castShadow=b.key!=='road';
  scene.add(m);b.mesh=m;
  if(pop)addPop(m);
}
function placeBuilding(key,i,j,o){
  o=o||{};
  const s=o.size||1,tier=o.tier||'basic';
  const b={key:key,i:i,j:j,s:s,px:i+s/2,pz:j+s/2,level:o.level||1,growth:o.growth||0,
    tier:key==='road'?tier:'basic',
    variant:o.variant!=null?o.variant:((Math.random()*4)|0),
    invested:0,trash:o.trash||0,fire:o.fire||0,theft:o.theft||0,
    mesh:null,icon:null,prob:null,cover:null,flames:null,
    hasRoad:true,hasPower:true,hasWater:true,active:true,adj:[],rtier:0,
    cov:{police:false,fire:false,waste:false,park:false},noise:0,happy:60,income:0,traffic:0,cong:0,load:0};
  b.invested=o.invested!=null?o.invested:costOf(key,key==='road'?tier:s);
  for(let a=i;a<i+s;a++)for(let c=j;c<j+s;c++)grid[a][c]=b;
  buildMesh(b,!o.instant);
  if(key==='road')updateRoadsAround(i,j);
  if(radiusOf(b)>0)addCover(b);
  if(!o.instant)fxRing(b.px-HALF,b.pz-HALF,'#ffffff',s);
  ALL=bsList();
  return b;
}
function removeBuilding(b){
  if(b.mesh)scene.remove(b.mesh);
  if(b.icon)scene.remove(b.icon);
  if(b.flames)scene.remove(b.flames);
  if(b.cover)b.cover.forEach(function(o){coverGroup.remove(o);});
  for(let a=b.i;a<b.i+b.s;a++)for(let c=b.j;c<b.j+b.s;c++)grid[a][c]=null;
  if(b.key==='road')updateRoadsAround(b.i,b.j);
  ALL=bsList();
}
function levelUp(b){
  b.level++;b.growth=0;
  buildMesh(b,true);
  fxRing(b.px-HALF,b.pz-HALF,'#ffe066',b.s);
}
const fpOf=(i,j,s)=>({i:clamp(i-((s-1)>>1),0,N-s),j:clamp(j-((s-1)>>1),0,N-s),s:s});
function isFree(fp){
  for(let a=fp.i;a<fp.i+fp.s;a++)for(let c=fp.j;c<fp.j+fp.s;c++)if(!inb(a,c)||grid[a][c])return false;
  return true;
}
function svcNear(kind,px,pz,r){
  return ALL.some(function(b){
    if(b.key!==kind||!b.hasRoad)return false;
    const dx=b.px-px,dz=b.pz-pz;return dx*dx+dz*dz<=r*r;
  });
}

/* ====================== SIMULACIÓN ====================== */
function recalc(){
  ALL=bsList();
  const roads=[],zones=[],ress=[],inds=[],pw=[],wt=[],po=[],fi=[],ws=[],pk=[];
  let upkeep=0;
  for(const b of ALL){
    upkeep+=upkeepOf(b);
    if(b.key==='road'){roads.push(b);continue;}
    b.adj=adjRoads(b);
    b.hasRoad=b.adj.length>0;
    b.rtier=0;
    for(const r of b.adj)b.rtier=Math.max(b.rtier,r.tier==='avenue'?2:1);
    if(TOOLS[b.key].zone){
      zones.push(b);
      if(b.key==='res')ress.push(b);else if(b.key==='ind')inds.push(b);
      continue;
    }
    b.active=b.hasRoad;
    if(!b.hasRoad){b.load=0;continue;}
    if(b.key==='power')pw.push(b);else if(b.key==='water')wt.push(b);
    else if(b.key==='police')po.push(b);else if(b.key==='fire')fi.push(b);
    else if(b.key==='waste')ws.push(b);else if(b.key==='park')pk.push(b);
  }
  const d2=(a,b)=>{const dx=a.px-b.px,dz=a.pz-b.pz;return dx*dx+dz*dz;};
  const near=(list,b,r)=>list.some(s=>d2(s,b)<=r*r);

  /* energía y agua */
  let pc=0,wc=0;
  for(const z of zones){
    z.hasPower=near(pw,z,R.power);z.hasWater=near(wt,z,R.water);
    z.active=z.hasRoad&&z.hasPower&&z.hasWater;
    if(z.hasPower)pc+=CONS_P[z.key][z.level-1];
    if(z.hasWater)wc+=CONS_W[z.key][z.level-1];
  }
  S.powerProd=pw.length*CAP.power;S.waterProd=wt.length*CAP.water;
  S.powerCons=pc;S.waterCons=wc;
  S.pr=pc>0?Math.min(1,S.powerProd/pc):1;
  S.wr=wc>0?Math.min(1,S.waterProd/wc):1;

  /* servicios con capacidad: policía, bomberos, residuos */
  const byLvl=zones.slice().sort((x,y)=>y.level-x.level);
  const assign=function(list,kind){
    const cap=list.map(s=>SV[kind].cap[s.s-1]);
    for(const z of byLvl){
      z.cov[kind]=false;
      let best=-1,bd=1e9;
      for(let k=0;k<list.length;k++){
        const r=SV[kind].r[list[k].s-1],d=d2(list[k],z);
        if(d<=r*r&&d<bd&&cap[k]>=z.level){bd=d;best=k;}
      }
      if(best>=0){cap[best]-=z.level;z.cov[kind]=true;}
    }
    list.forEach(function(s,k){s.load=SV[kind].cap[s.s-1]-cap[k];});
  };
  assign(po,'police');assign(fi,'fire');assign(ws,'waste');
  for(const z of zones)z.cov.park=near(pk,z,R.park);

  /* tráfico: viajes de zonas activas repartidos por sus carreteras y difundidos */
  for(const r of roads)r.t0=0;
  for(const z of zones){
    if(!z.active||!z.adj.length)continue;
    const t=TRIPS[z.key][z.level-1]/z.adj.length;
    for(const r of z.adj)r.t0+=t;
  }
  for(let pass=0;pass<2;pass++){
    for(const r of roads){const nb=roadNbrs(r);r.t1=r.t0+(nb.length?.5*nb.reduce((s,n)=>s+n.t0,0)/nb.length:0);}
    for(const r of roads)r.t0=r.t1;
  }
  for(const r of roads){r.traffic=r.t0;r.cong=r.t0/ROADS[r.tier].cap;}

  /* contaminación acústica: industrias y avenidas con mucho tráfico */
  const src=[];
  for(const b of inds)if(b.active)src.push({x:b.px,z:b.pz,s:[.7,1.1,1.6][b.level-1],r:3.5});
  for(const r of roads){
    if(r.tier==='avenue'&&r.cong>=.3)src.push({x:r.px,z:r.pz,s:.5+Math.min(r.cong,1.5)*.6,r:2.2});
    else if(r.tier==='basic'&&r.cong>1.2)src.push({x:r.px,z:r.pz,s:.3,r:1.6});
  }
  for(const z of zones){
    z.noise=0;
    if(z.key!=='res')continue;
    let n=0;
    for(const q of src){const dx=q.x-z.px,dz=q.z-z.pz,d=Math.sqrt(dx*dx+dz*dz);if(d<q.r)n+=q.s*(1-d/q.r);}
    z.noise=Math.min(3,n);
  }

  /* felicidad, empleo y población */
  let hw=0,hs=0,capAct=0,comJ=0,indJ=0,nf=0,nt=0;
  for(const z of zones){
    const L=z.level-1;
    if(z.fire)nf++;
    if(z.theft)nt++;
    if(z.key==='res'){
      const h=58+(z.cov.park?14:0)+(z.cov.police?9:0)+(z.cov.fire?4:0)-z.noise*8-z.trash*.2
        -(z.hasRoad?0:8)-(z.hasPower?0:10)-(z.hasWater?0:10)-(z.fire?22:0)-(z.theft?14:0);
      z.happy=clamp(h,0,100);
      hs+=z.happy*POPCAP[L];hw+=POPCAP[L];
      if(z.active)capAct+=POPCAP[L];
    }else if(z.active){
      if(z.key==='com')comJ+=JOBS.com[L];else indJ+=JOBS.ind[L];
    }
  }
  const jobs=comJ+indJ,pop=S.pop;
  S.fires=nf;S.thefts=nt;
  let hp=hw>0?hs/hw:60;
  hp-=Math.min(25,nf*6)+Math.min(20,nt*4);
  hp-=(1-S.pr)*20+(1-S.wr)*20;
  if(pop>0)hp-=Math.max(0,(pop-jobs)/pop)*12;
  if(S.money<0)hp-=8;
  S.happy=Math.round(clamp(hp,0,100));
  S.popTarget=Math.round(capAct*(.6+.4*S.happy/100));

  /* demanda RCI */
  S.dR=clamp((jobs+20-pop)/(jobs*.8+40),-1,1);
  S.dC=clamp((pop*.4+6-comJ)/(pop*.3+20),-1,1);
  S.dI=clamp((pop*.45+8-indJ)/(pop*.3+20)-(S.happy<40?.2:0),-1,1);

  /* ingresos por edificio (los incidentes los hunden) */
  const employed=Math.min(pop,jobs),hf=.5+.5*S.happy/100;
  const resTax=(employed*1.9+(pop-employed)*.7)*hf;
  const cf=.4+.6*Math.min(1,pop/(comJ*1.5+1));
  const lf=jobs>0?Math.min(1,pop/jobs):1;
  let inc=0;
  for(const z of zones){
    const L=z.level-1;let base=0;
    if(z.active){
      if(z.key==='res')base=capAct>0?resTax*POPCAP[L]/capAct:0;
      else if(z.key==='com')base=INC.com[L]*cf;
      else base=INC.ind[L]*(.4+.6*lf);
    }
    let mult=1;
    if(z.theft)mult=0;else if(z.fire)mult=.1;
    if(z.trash>80)mult*=.75;
    if(z.adj.some(r=>r.cong>1.4))mult*=.85;
    z.income=base*mult*S.pr*S.wr;
    inc+=z.income;
  }
  S.income=inc;S.upkeep=upkeep;S.net=inc-upkeep;
  refreshIcons();refreshCovers();updateHUD();
}
function refreshCovers(){
  for(const b of ALL)if(b.cover)b.cover.forEach(function(m){m.visible=b.hasRoad;});
}
function refreshIcons(){
  for(const b of ALL){
    if(b.key==='road')continue;
    const z=!!TOOLS[b.key].zone;
    const p=b.fire?'fire':b.theft?'theft':!b.hasRoad?'road':(z&&!b.hasPower)?'power':(z&&!b.hasWater)?'water'
      :(z&&b.trash>=60)?'trash':(b.key==='res'&&b.noise>=1.5)?'noise':null;
    if(p!==b.prob){
      if(b.icon){scene.remove(b.icon);b.icon=null;}
      b.prob=p;
      if(p){
        const sp=new THREE.Sprite(ICON_MAT[p]),k=.62+.1*(b.s-1);
        sp.scale.set(k,k,1);sp.position.set(b.px-HALF,topY(b)+.5,b.pz-HALF);
        sp.renderOrder=10;scene.add(sp);b.icon=sp;
      }
    }
    if(b.fire&&!b.flames)b.flames=makeFlames(b);
    else if(!b.fire&&b.flames){scene.remove(b.flames);b.flames=null;}
    else if(b.flames)b.flames.position.y=topY(b)-.15;
  }
}

/* ====================== INCIDENTES ====================== */
const fireCost=z=>80+60*z.level;
const theftCost=z=>60+40*z.level;
function startFire(z){
  z.fire=1;
  fxRing(z.px-HALF,z.pz-HALF,'#ff5a3c',z.s);
  toast('🔥 ¡Incendio en '+nameOf(z)+'!');SFX.alarm();
}
function startTheft(z){
  z.theft=1;
  const loss=Math.min(Math.max(S.money,0),Math.round(15*z.level));
  S.money-=loss;
  toast('🚨 ¡Robo en '+nameOf(z)+'! −$'+loss);SFX.theft();
}
function extinguish(z,byPlayer){
  z.fire=0;fxRing(z.px-HALF,z.pz-HALF,'#4aa8ff',z.s);SFX.extinguish();
  toast(byPlayer?'🧯 Incendio sofocado':'🚒 Los bomberos apagaron el incendio');
}
function resolveTheft(z,byPlayer){
  z.theft=0;SFX.coin();
  toast(byPlayer?'🛡️ Seguridad contratada: robo resuelto':'🚓 La policía resolvió el robo');
}
function burnDown(z){
  toast('💥 '+nameOf(z)+' ha ardido por completo');
  fxRing(z.px-HALF,z.pz-HALF,'#ff5a3c',z.s);
  removeBuilding(z);SFX.demolish();
}
function rollIncidents(){
  const zs=ALL.filter(b=>TOOLS[b.key].zone);
  if(S.day<12||zs.length<4)return;
  let act=zs.filter(b=>b.fire||b.theft).length;
  const maxAct=Math.max(1,Math.floor(zs.length/6));
  for(const z of zs){
    if(act>=maxAct)break;
    if(z.fire||z.theft)continue;
    let pf=.0018*({res:.8,com:1,ind:1.6}[z.key])*(z.cov.fire?1:4)*(z.trash>70?1.5:1)*(1+(z.level-1)*.15);
    if(zs.some(o=>o.fire&&(o.px-z.px)*(o.px-z.px)+(o.pz-z.pz)*(o.pz-z.pz)<=6.25))pf*=2.5;
    const pt=.0022*({res:1,com:1.5,ind:.6}[z.key])*(z.cov.police?1:2.5)*(S.happy<40?1.8:1);
    const r=Math.random();
    if(r<pf){startFire(z);act++;}
    else if(r<pf+pt){startTheft(z);act++;}
  }
}

/* ====================== BUCLE DE DÍAS ====================== */
function dayTick(){
  S.day++;
  recalc();
  S.money+=S.net;S.money=Math.round(S.money*10)/10;
  floatMoney(S.net);
  if(S.net>=0)SFX.coin();
  const zs=ALL.filter(b=>TOOLS[b.key].zone);
  /* basura */
  for(const z of zs){
    if(z.cov.waste)z.trash=Math.max(0,z.trash-18);
    else z.trash=Math.min(100,z.trash+TRASH_GEN[z.level-1]);
  }
  /* evolución de incidentes */
  for(const z of zs){
    if(z.fire){
      if(z.cov.fire)extinguish(z,false);
      else{z.fire++;if(z.fire>6)burnDown(z);}
    }else if(z.theft){
      if(z.cov.police)resolveTheft(z,false);
      else{
        z.theft++;
        if(z.theft>5){
          z.theft=0;
          const loss=Math.min(Math.max(S.money,0),25*z.level);S.money-=loss;
          toast('🚨 Los ladrones se fueron con $'+loss+' más');
        }
      }
    }
  }
  /* población (lenta) */
  const tgt=S.popTarget;let p=S.pop;
  if(p<tgt)p=Math.min(tgt,p+Math.max(1,(tgt-p)*.15));
  else if(p>tgt)p=Math.max(tgt,p-Math.max(2,(p-tgt)*.4));
  S.pop=Math.round(p);
  /* crecimiento lento: requiere días seguidos de demanda estable */
  const dem={res:S.dR,com:S.dC,ind:S.dI};
  let grew=false;
  for(const z of zs){
    if(grid[z.i][z.j]!==z)continue;
    const maxL=z.rtier>=2?3:2;
    if(z.level>=maxL)continue;
    const d=dem[z.key];
    const ok=z.active&&!z.fire&&!z.theft&&d>.08&&S.happy>=40&&z.trash<60&&z.adj.every(r=>r.cong<1.5);
    if(ok){z.growth++;if(z.growth>=GROW[z.level-1]){levelUp(z);grew=true;}}
    else if(d<=0)z.growth=Math.max(0,z.growth-2);
    else z.growth=Math.max(0,z.growth-1);
  }
  if(grew)SFX.levelup();
  rollIncidents();
  while(S.ms<MILESTONES.length&&S.pop>=MILESTONES[S.ms]){
    toast('🎉 ¡'+fmt(MILESTONES[S.ms])+' habitantes!');SFX.fanfare();S.ms++;
  }
  if(S.money<0&&S.net<0)toast('⚠️ Deuda: los gastos superan a los ingresos');
  recalc();
  updateBar();
  save();
}

/* ====================== GUARDADO ====================== */
function save(){
  try{
    const cells=ALL.map(b=>[b.key,b.i,b.j,b.s,b.level,b.growth,b.invested,b.variant,b.tier,Math.round(b.trash),b.fire,b.theft]);
    localStorage.setItem(SAVE_KEY,JSON.stringify({v:2,money:S.money,day:S.day,pop:S.pop,ms:S.ms,cells:cells}));
  }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const d=JSON.parse(raw);
    if(!d||d.v!==2||!Array.isArray(d.cells))return false;
    S.money=d.money;S.day=d.day;S.pop=d.pop||0;S.ms=d.ms||0;
    d.cells.forEach(function(r){
      const key=r[0],i=r[1],j=r[2],s=r[3];
      if(!TOOLS[key]||!inb(i,j)||!inb(i+s-1,j+s-1))return;
      if(!isFree({i:i,j:j,s:s}))return;
      placeBuilding(key,i,j,{size:s,level:r[4],growth:r[5],invested:r[6],variant:r[7],tier:r[8],trash:r[9],fire:r[10],theft:r[11],instant:true});
    });
    for(const b of bsList())if(b.key==='road')b.mesh.geometry=roadGeo(roadMaskAt(b.i,b.j),b.tier);
    return true;
  }catch(e){return false;}
}

function setBtn(el,d){
  if(!d){el.style.display='none';el._fn=null;return;}
  el.style.display='';el.textContent=d.label;
  el.className='btn '+(d.cls||'');el.disabled=!!d.dis;el._fn=d.fn;
}
function setBar(o){
  const bar=$('infobar');
  if(!o){bar.classList.add('hidden');return;}
  bar.classList.remove('hidden');
  $('ibIco').textContent=o.ico||'';$('ibTitle').textContent=o.title||'';
  $('ibSub').textContent=o.sub||'';$('ibWarn').textContent=o.warn||'';
  setBtn($('ibA'),o.a);setBtn($('ibB'),o.b);
}
function zoneWarn(b){
  if(b.fire)return '🔥 ¡INCENDIO! Ingresos −90 % · '+(b.cov.fire?'bomberos en camino':'sin cobertura de bomberos');
  if(b.theft)return '🚨 ¡ROBO en curso! Ingresos 0 · '+(b.cov.police?'la policía interviene':'sin cobertura policial');
  const pr=[];
  if(!b.hasRoad)pr.push('carretera 🚧');if(!b.hasPower)pr.push('electricidad');if(!b.hasWater)pr.push('agua');
  if(pr.length)return '⚠ Inactivo. Falta: '+pr.join(', ');
  if(b.trash>=60)return '🗑️ Basura acumulada ('+Math.round(b.trash)+' %): falta recogida';
  if(b.key==='res'&&b.noise>=1.5)return '🔊 Ruido alto: baja la felicidad';
  if(b.level>=3)return '✅ Nivel máximo';
  if(b.level>=2&&b.rtier<2)return '🛣️ Para nivel 3 necesita una Avenida adyacente';
  const d={res:S.dR,com:S.dC,ind:S.dI}[b.key];
  if(d<=.08)return 'Sin demanda suficiente para crecer';
  return '📈 Creciendo ('+b.growth+'/'+GROW[b.level-1]+' días)';
}
function inspectBar(b){
  const refund=Math.floor(b.invested*REFUND);
  const dm={label:'Demoler +$'+refund,cls:'red',fn:function(){doDemolish(b);}};
  let sub='',warn='',a=null;
  if(TOOLS[b.key].zone){
    const L=b.level-1;
    sub='Nivel '+b.level+'/3 · '+(b.key==='res'?POPCAP[L]+' hab.':JOBS[b.key][L]+' empleos')+' · ~$'+Math.round(b.income)+'/día';
    warn=zoneWarn(b);
    if(b.fire)a={label:'Apagar $'+fireCost(b),dis:S.money<fireCost(b),fn:function(){payFire(b);}};
    else if(b.theft)a={label:'Seguridad $'+theftCost(b),dis:S.money<theftCost(b),fn:function(){payTheft(b);}};
    else if(b.level<3){
      const cost=UPG[b.key][L];
      a={label:'Mejorar $'+cost,dis:S.money<cost||!b.active||(b.level>=2&&b.rtier<2),fn:function(){upgrade(b);}};
    }
  }else if(b.key==='road'){
    const R2=ROADS[b.tier];
    sub='Tráfico '+Math.round(b.traffic)+'/'+R2.cap+' ('+Math.round(b.cong*100)+' %) · mant. $'+R2.upkeep+'/día';
    warn=b.tier==='avenue'?(b.cong>=.3?'🔊 Mucho tráfico: genera ruido cerca':'Avenida: permite edificios de nivel 3')
      :(b.cong>1?'⚠ Congestionada: mejórala a Avenida':'Carretera básica (las zonas llegan a nivel 2)');
    if(b.tier==='basic')a={label:'Avenida $'+ROAD_UPG,dis:S.money<ROAD_UPG,fn:function(){upgradeRoad(b);}};
  }else if(SV[b.key]){
    const V=SV[b.key];
    sub='Radio '+V.r[b.s-1]+' · Atiende '+b.load+'/'+V.cap[b.s-1]+' niv. · mant. $'+V.up[b.s-1]+'/día';
    warn=b.hasRoad?(b.load>=V.cap[b.s-1]?'⚠ Saturado: amplía con otro servicio':'✅ Operativo'):'🚧 Sin carretera adyacente: inactivo';
  }else{
    const T=TOOLS[b.key];
    sub=T.desc.replace(/\.$/,'')+' · mant. $'+T.upkeep+'/día';
    if(b.key==='power')sub='Red: '+Math.round(S.powerCons)+'/'+S.powerProd+' · radio 6 · mant. $'+T.upkeep+'/día';
    if(b.key==='water')sub='Red: '+Math.round(S.waterCons)+'/'+S.waterProd+' · radio 6 · mant. $'+T.upkeep+'/día';
    warn=b.hasRoad?'✅ Operativo':'🚧 Sin carretera adyacente: inactivo';
  }
  return {ico:iconOf(b),title:nameOf(b),sub:sub,warn:warn,a:a,b:dm};
}
function placementBar(){
  const k=tool,s=sizeOfTool(),cost=costNow();
  let name,sub;
  if(k==='road'){
    const R2=ROADS[curRoad];name=R2.name;
    sub=curRoad==='basic'?'1 carril por sentido · capacidad '+R2.cap+' · mant. $'+R2.upkeep+'/día'
      :'Gran capacidad ('+R2.cap+') · permite nivel 3 · hace ruido con tráfico · mant. $'+R2.upkeep+'/día';
  }else if(SV[k]){
    const V=SV[k];name=V.names[s-1];
    sub='Radio '+V.r[s-1]+' · Capacidad '+V.cap[s-1]+' niv. · mant. $'+V.up[s-1]+'/día';
  }else{
    name=TOOLS[k].name;sub=TOOLS[k].desc.replace(/\.$/,'')+(TOOLS[k].upkeep?' · mant. $'+TOOLS[k].upkeep+'/día':'');
  }
  if(!sel){
    setBar({ico:TOOLS[k].icon,title:name,sub:sub,warn:k==='road'?'Toca una celda para colocarla · $'+cost:'Toca una celda para la vista previa · $'+cost});
    return;
  }
  const fp=fpOf(sel.i,sel.j,s);
  if(!isFree(fp)){setBar({ico:TOOLS[k].icon,title:name,sub:'Esa zona está ocupada',warn:'Elige un hueco libre'+(s>1?' de '+s+'×'+s:'')});return;}
  let warn='';
  if(k!=='road'){
    const w=[],px=fp.i+s/2,pz=fp.j+s/2;
    if(!adjRoads(fp).length)w.push('carretera adyacente 🚧');
    if(TOOLS[k].zone){
      if(!svcNear('power',px,pz,R.power))w.push('electricidad');
      if(!svcNear('water',px,pz,R.water))w.push('agua');
    }
    if(w.length)warn='⚠ Necesitará: '+w.join(', ');
  }
  setBar({ico:TOOLS[k].icon,title:name,sub:sub,warn:warn,a:{label:'Construir $'+cost,dis:S.money<cost,fn:confirmBuild}});
}
function updateBar(){
  const c=sel?grid[sel.i][sel.j]:null;
  if(tool===null){
    if(!sel||!c){
      if(!ALL.length)setBar({ico:'🏗️',title:'Tu ciudad está vacía',sub:'Empieza con una 🛣️ carretera y coloca ⚡ energía y 💧 agua junto a ella',warn:'Todo edificio necesita una carretera adyacente'});
      else setBar(null);
      return;
    }
    setBar(inspectBar(c));return;
  }
  if(tool==='demolish'){
    if(!sel){setBar({ico:'🔨',title:'Modo demolición',sub:'Toca un edificio · solo recuperas el 20 % de lo invertido'});return;}
    if(!c){setBar({ico:'🔨',title:'Nada que demoler',sub:'Esta celda está vacía'});return;}
    const refund=Math.floor(c.invested*REFUND);
    setBar({ico:'🔨',title:'Demoler '+nameOf(c),sub:'Recuperas $'+refund+' (20 %)',a:{label:'Demoler +$'+refund,cls:'red',fn:function(){doDemolish(c);}}});
    return;
  }
  placementBar();
}

/* ---- vista previa 3D ---- */
function updateGhost(){
  ghost.visible=false;tile.visible=false;gDisc.visible=false;gRing.visible=false;
  if(!sel)return;
  const c=grid[sel.i][sel.j];
  if(tool===null){if(c)showTile(c.i,c.j,c.s,'#ffe066');return;}
  if(tool==='demolish'){if(c)showTile(c.i,c.j,c.s,'#ff4d4d');else showTile(sel.i,sel.j,1,'#9aa5b1');return;}
  const s=sizeOfTool(),fp=fpOf(sel.i,sel.j,s),free=isFree(fp);
  showTile(fp.i,fp.j,s,!free?'#ff4d4d':(S.money>=costNow()?'#4cff7a':'#ffb347'));
  if(!free)return;
  ghost.geometry=tool==='road'?roadGeo(roadMaskAt(fp.i,fp.j),curRoad):geoFor({key:tool,level:1,variant:0,s:s});
  ghost.position.set(fp.i+s/2-HALF,0,fp.j+s/2-HALF);ghost.visible=true;
  const r=toolRadius(tool,s);
  if(r){
    gDisc.material.color.set(COVER_COL[tool]);gRing.material.color.set(COVER_COL[tool]);
    [gDisc,gRing].forEach(function(m){m.position.x=fp.i+s/2-HALF;m.position.z=fp.j+s/2-HALF;m.scale.set(r,1,r);m.visible=true;});
  }
}
function refreshSel(){updateGhost();updateBar();}

/* ---- acciones ---- */
function confirmBuild(){if(tool&&sel&&tool!=='demolish')buildAt(fpOf(sel.i,sel.j,sizeOfTool()));}
function buildAt(fp){
  const key=tool,cost=costNow();
  if(!isFree(fp)){toast('La zona está ocupada');SFX.error();return false;}
  if(S.money<cost){toast('Dinero insuficiente');SFX.error();return false;}
  S.money-=cost;
  placeBuilding(key,fp.i,fp.j,{size:fp.s,tier:key==='road'?curRoad:'basic'});
  SFX.build();sel=null;
  recalc();refreshSel();save();
  return true;
}
function doDemolish(b){
  if(grid[b.i][b.j]!==b)return;
  const refund=Math.floor(b.invested*REFUND);
  S.money+=refund;
  fxRing(b.px-HALF,b.pz-HALF,'#ff5a5f',b.s);
  removeBuilding(b);SFX.demolish();
  toast('+$'+refund+' recuperados (20 %)');
  sel=null;recalc();refreshSel();save();
}
function upgrade(b){
  if(b.level>=3)return;
  const cost=UPG[b.key][b.level-1];
  if(!b.active){toast('Necesita carretera, energía y agua');SFX.error();return;}
  if(b.level>=2&&b.rtier<2){toast('Para nivel 3 necesita una Avenida adyacente');SFX.error();return;}
  if(S.money<cost){toast('Dinero insuficiente');SFX.error();return;}
  S.money-=cost;b.invested+=cost;
  levelUp(b);SFX.levelup();
  recalc();updateBar();save();
}
function upgradeRoad(b){
  if(S.money<ROAD_UPG){toast('Dinero insuficiente');SFX.error();return;}
  S.money-=ROAD_UPG;b.tier='avenue';b.invested+=ROAD_UPG;
  b.mesh.geometry=roadGeo(roadMaskAt(b.i,b.j),'avenue');
  fxRing(b.px-HALF,b.pz-HALF,'#ffe066',1);SFX.build();
  recalc();updateBar();save();
}
function payFire(z){
  const c=fireCost(z);
  if(S.money<c){toast('Dinero insuficiente');SFX.error();return;}
  S.money-=c;extinguish(z,true);recalc();refreshSel();save();
}
function payTheft(z){
  const c=theftCost(z);
  if(S.money<c){toast('Dinero insuficiente');SFX.error();return;}
  S.money-=c;resolveTheft(z,true);recalc();refreshSel();save();
}
function handleTap(i,j){
  if(!inb(i,j)){sel=null;refreshSel();return;}
  const c=grid[i][j];
  if(tool===null){sel=c?{i:i,j:j}:null;SFX.click();refreshSel();return;}
  if(tool==='demolish'){
    const same=!!c&&!!sel&&grid[sel.i][sel.j]===c;
    if(c&&(CFG.quick||same)){doDemolish(c);return;}
    sel={i:i,j:j};SFX.click();refreshSel();return;
  }
  const s=sizeOfTool(),fp=fpOf(i,j,s);
  if(tool==='road'||CFG.quick){buildAt(fp);return;}
  const cur=sel?fpOf(sel.i,sel.j,s):null;
  if(cur&&cur.i===fp.i&&cur.j===fp.j){buildAt(fp);return;}
  sel={i:i,j:j};SFX.click();refreshSel();
}

  else if(act==='quick'){CFG.quick=!CFG.quick;saveCfg();openMenu();SFX.click();}
  else if(act==='help'){openModal(helpHTML());}
  else if(act==='reset'){
    if(b.dataset.armed){resetCity();closeModal();toast('🏗️ Nueva ciudad: $'+START_MONEY);}
    else{b.dataset.armed='1';b.textContent='⚠️ ¿Seguro? Toca de nuevo para borrar todo';}
  }
});
$('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

/* ====================== ENTRADA (tap vs arrastre) ====================== */
const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hitV=new THREE.Vector3();
function onTap(px,py){
  const r=canvas.getBoundingClientRect();
  ndc.x=((px-r.left)/r.width)*2-1;
  ndc.y=-((py-r.top)/r.height)*2+1;
  raycaster.setFromCamera(ndc,camera);
  if(!raycaster.ray.intersectPlane(groundPlane,hitV))return;
  handleTap(Math.floor(hitV.x+HALF),Math.floor(hitV.z+HALF));
}
const ptrs=new Set();let tapInfo=null;
canvas.addEventListener('pointerdown',function(e){
  ensureAudio();
  ptrs.add(e.pointerId);
  if(ptrs.size===1)tapInfo={x:e.clientX,y:e.clientY,t:performance.now(),ok:true};
  else if(tapInfo)tapInfo.ok=false;
});
canvas.addEventListener('pointermove',function(e){
  if(tapInfo&&tapInfo.ok&&Math.hypot(e.clientX-tapInfo.x,e.clientY-tapInfo.y)>10)tapInfo.ok=false;
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(tapInfo&&tapInfo.ok&&ptrs.size===0&&e.type==='pointerup'&&performance.now()-tapInfo.t<550)onTap(e.clientX,e.clientY);
  if(ptrs.size===0)tapInfo=null;
}
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});

/* ====================== REDIMENSIONADO ====================== */
function resize(){
  const w=app.clientWidth||window.innerWidth,h=app.clientHeight||window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  app.style.setProperty('--u',clamp(w/360,.85,1.3).toFixed(3));
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});
if(window.ResizeObserver)new ResizeObserver(resize).observe(app);
resize();


/* ====================== BUCLE PRINCIPAL ====================== */
let last=performance.now(),dayT=0,tt=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;
  const sp=SPEEDS[S.speedIdx];
  if(sp>0){
    dayT+=dt*sp;
    if(dayT>=DAY_LEN){dayT-=DAY_LEN;dayTick();}
  }
  $('dayBar').style.width=(dayT/DAY_LEN*100).toFixed(1)+'%';
  /* aparición de edificios */
  for(let k=anims.length-1;k>=0;k--){
    const a=anims[k];a.t+=dt;
    const q=Math.min(1,a.t/.45);
    a.m.scale.setScalar(Math.max(.001,easeOutBack(q)));
    if(q>=1){a.m.scale.setScalar(1);anims.splice(k,1);}
  }
  for(let k=fxList.length-1;k>=0;k--){
    const f=fxList[k];f.t+=dt;
    const q=f.t/.55;
    if(q>=1){scene.remove(f.m);f.m.material.dispose();fxList.splice(k,1);continue;}
    f.m.scale.setScalar((.3+q*1.2)*f.sz);f.m.material.opacity=.9*(1-q);
  }
  /* iconos de aviso y llamas */
  for(const b of ALL){
    if(b.icon)b.icon.position.y=topY(b)+.5+Math.sin(tt*3+b.i+b.j)*.06;
    if(b.flames){
      b.flames.children.forEach(function(m){
        const u=m.userData,k=1+.25*Math.sin(tt*9+u.ph);
        m.scale.set(u.s0*k,u.s0*(1.1+.5*Math.sin(tt*7+u.ph)),u.s0*k);
      });
    }
  }
  if(ghost.visible){
    ghostMat.opacity=.55+.15*Math.sin(tt*6);
    ghost.position.y=.02+Math.sin(tt*4)*.02;
  }
  if(tile.visible)tile.material.opacity=.42+.14*Math.sin(tt*6);
  clouds.forEach(function(c){c.position.x+=c.userData.sp*dt;if(c.position.x>38)c.position.x=-38;});
  controls.update();
  renderer.render(scene,camera);
}

/* ====================== ARRANQUE ====================== */
load();
recalc();
refreshSel();refreshCats();
boot.style.display='none';
requestAnimationFrame(loop);
if(!CFG.help)openModal(helpHTML());
window.addEventListener('beforeunload',save);

})();
</script>
